<text x="692" y="772" font-size="20" font-weight="700">Watchdog</text>
<text x="692" y="804" font-size="16" fill="#42566b">자동화가 제대로 돌았나?</text>
<text x="692" y="832" font-size="16" fill="#42566b">미발행 · 실패 · 처리 지연</text>
