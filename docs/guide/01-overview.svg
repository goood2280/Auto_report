<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="01-overview-title 01-overview-desc">
<title id="01-overview-title">데이터 하나, 서로 다른 네 가지 질문</title>
<desc id="01-overview-desc">업무 흐름도 · 측정 데이터와 운영 기록은 서로 다른 목적으로 읽습니다. 업무 역할을 그린 그림입니다. 실제 프로세스 경계는 다음 그림에서 확인합니다. / 각 실행은 RUN/OPS에 기록합니다. 로그 쓰기 화살표와 선택적 DX/S3 업로드는 전체도에서 생략했습니다. / ML Insight 결과는 기본 Auto Report의 판정 규칙을 자동으로 바꾸지 않습니다.</desc>
