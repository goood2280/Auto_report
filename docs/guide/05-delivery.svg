<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 928" role="img" aria-labelledby="05-delivery-title 05-delivery-desc">
<title id="05-delivery-title">메일 응답을 잃었다면, 성공도 실패도 단정하지 않는다</title>
<desc id="05-delivery-desc">발송 상태 흐름 · 저장된 원본과 영속 이력이 중복 발송을 줄이는 기준입니다. HTTP 200은 메일 API 성공 응답이며, 수신자의 열람 확인을 뜻하지 않습니다. / HTTP 4xx 등 확인된 요청 거부와 전송 전 파일·설정 오류는 failed입니다. 전송 후 응답을 확정하지 못한 예외와 5xx는 unknown이며 자동 재전송하지 않습니다. / 기본 AUTO는 use_email_send를 확인합니다. Daily Trend / ML / Watchdog은 각 서비스의 발송 조건을 사용합니다. / Watchdog은 관측된 실행 결과를 보고합니다. 기록이 없으면 정상이나 성공으로 추정하지 않습니다.</desc>
<defs><marker id="05-delivery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1280" height="100%" fill="#f8fafc"/>
<g font-family="Segoe UI, Malgun Gothic, sans-serif" fill="#172c43">
