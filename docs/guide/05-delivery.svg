<text x="68" y="172" font-size="12" fill="#52657a">SAVED ARTIFACTS</text>
<text x="68" y="204" font-size="20" font-weight="700">발행 원본 확보</text>
<text x="68" y="236" font-size="16" fill="#42566b">HTML / PPT 또는 운영 CSV</text>
