<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 912" role="img" aria-labelledby="04-trend-ml-title 04-trend-ml-desc">
<title id="04-trend-ml-title">전체 추세와 유의한 변화를 나눠 본다</title>
<desc id="04-trend-ml-desc">Daily Trend와 ML Insight는 데이터 준비를 공유하지만, 선택 기준과 목적이 다릅니다. ML_TABLE은 외부에서 준비된 입력입니다. 이 보고 경로가 원천 ML_TABLE을 생성하지 않습니다. / Daily Trend의 시간/Split 매핑은 설정할 때 사용합니다. ML Insight는 장비 등 진단 정보도 읽습니다. / IF/LOF는 과거 데이터로 학습하고 별도 기준 구간 및 새 측정을 비교합니다. 장비 연관성은 원인 확정이 아닙니다. / with_vehicle는 ML 비교 데이터 확장 옵션입니다. 기본 리포트 판정으로 되먹임하지 않습니다.</desc>
<defs><marker id="04-trend-ml-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1280" height="100%" fill="#f8fafc"/>
<g font-family="Segoe UI, Malgun Gothic, sans-serif" fill="#172c43">
<text x="32" y="44" font-size="28" font-weight="700">전체 추세와 유의한 변화를 나눠 본다</text>
<text x="32" y="80" font-size="16" fill="#52657a">Daily Trend와 ML Insight는 데이터 준비를 공유하지만, 선택 기준과 목적이 다릅니다.</text>
