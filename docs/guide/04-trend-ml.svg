<g data-node="db"><rect x="48" y="128" width="320" height="144" rx="8" fill="#eef2f6" stroke="#8b9aab" stroke-width="1.5"/>
<text x="68" y="156" font-size="12" fill="#52657a">daily_trend_load</text>
<text x="68" y="188" font-size="20" font-weight="700">현재 ET 데이터</text>
<text x="68" y="220" font-size="16" fill="#42566b">날짜별 Parquet → REAL / ADDP</text>
<text x="68" y="248" font-size="16" fill="#42566b">제품 viewing_period로 기간 결정</text>
</g>
