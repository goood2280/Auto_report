<line x1="32" y1="832" x2="1248" y2="832" stroke="#cbd5e1"/>
<text x="32" y="860" font-size="12" fill="#52657a">실선: 데이터·접근·처리 관계　 ·　 점선: 별도 프로세스 실행　 ·　 파란 테두리: 이 그림의 핵심</text>
</g></svg>
