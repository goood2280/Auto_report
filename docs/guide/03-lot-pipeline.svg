<text x="68" y="172" font-size="12" fill="#52657a">My_Function.py</text>
<text x="68" y="204" font-size="20" font-weight="700">1. 측정·공정 상태 갱신</text>
<text x="68" y="236" font-size="16" fill="#42566b">ET / WIP 조회</text>
<text x="68" y="264" font-size="16" fill="#42566b">일별 Parquet · 로그 적재</text>
</g>
<g data-node="select"><rect x="480" y="144" width="320" height="144" rx="8" fill="#eaf3f8" stroke="#24658a" stroke-width="1.5"/>
<text x="500" y="172" font-size="12" fill="#52657a">Main.py</text>
<text x="500" y="204" font-size="20" font-weight="700">2. 발행 대상 선택</text>
<text x="500" y="236" font-size="16" fill="#42566b">WIP 진행 + 지연시간 확인</text>
<text x="500" y="264" font-size="16" fill="#42566b">완료 전환 / 재시도 대상 선별</text>
</g>
