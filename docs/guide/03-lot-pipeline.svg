<g data-node="mail"><rect x="48" y="656" width="320" height="144" rx="8" fill="#f3f4f4" stroke="#bcc4cb" stroke-width="1.5"/>
<text x="68" y="684" font-size="12" fill="#52657a">Main.py</text>
<text x="68" y="716" font-size="20" font-weight="700">7. 메일 발송</text>
<text x="68" y="748" font-size="16" fill="#42566b">수신 그룹 해석 → 메일 API</text>
<text x="68" y="776" font-size="16" fill="#42566b">기존 성공 이력은 재사용</text>
