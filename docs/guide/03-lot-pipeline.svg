<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="03-lot-pipeline-title 03-lot-pipeline-desc">
<title id="03-lot-pipeline-title">한 번의 측정이 리포트가 되기까지</title>
<desc id="03-lot-pipeline-desc">일반 AUTO 경로 · 수동 트리거는 원천 쿼리를 건너뛰고 기존 DB의 지정 Lot · Step을 사용합니다. 번호는 이해를 돕는 논리 단계입니다. 차트 생성과 분석 호출 일부는 코드 안에서 서로 섞여 있습니다. / Target은 lot_id + step_id로 식별합니다. prime key는 제품 + Lot + Step을 묶는 발행 식별자입니다. / 외부 LLM 없이 코드로 분석합니다. 선택적 DX/S3 업로드는 저장 후 메일 전에 수행합니다.</desc>
<defs><marker id="03-lot-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1280" height="100%" fill="#f8fafc"/>
<g font-family="Segoe UI, Malgun Gothic, sans-serif" fill="#172c43">
<text x="32" y="44" font-size="28" font-weight="700">한 번의 측정이 리포트가 되기까지</text>
<text x="32" y="80" font-size="16" fill="#52657a">일반 AUTO 경로 · 수동 트리거는 원천 쿼리를 건너뛰고 기존 DB의 지정 Lot · Step을 사용합니다.</text>
