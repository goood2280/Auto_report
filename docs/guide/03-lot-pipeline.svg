<g data-node="result"><rect x="480" y="656" width="320" height="144" rx="8" fill="#eef2f6" stroke="#8b9aab" stroke-width="1.5"/>
<text x="500" y="684" font-size="12" fill="#52657a">RUN / OPS</text>
<text x="500" y="716" font-size="20" font-weight="700">8. 단계별 결과 기록</text>
<text x="500" y="748" font-size="16" fill="#42566b">생성 / 저장 / 메일을 구분</text>
<text x="500" y="776" font-size="16" fill="#42566b">Scheduler 및 Watchdog이 확인</text>
