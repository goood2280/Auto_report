<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="02-runtime-title 02-runtime-desc">
<title id="02-runtime-title">실행은 나뉘고, 기록으로 연결된다</title>
<desc id="02-runtime-desc">프로세스 구조 · 같은 Scheduler.py와 Main.py가 실행 인자에 따라 다른 역할을 맡습니다. 상시 Scheduler가 활성화된 독립 타이머를 기동합니다. --once / --drain은 자동 기동하지 않습니다. / 그림의 읽기·기록 화살표는 접근 관계입니다. 모든 워커가 모든 저장소를 쓰는 뜻은 아닙니다. / Watchdog은 Scheduler와 별도 프로세스지만 같은 서버에 있습니다. 서버가 꺼지면 감시 메일도 보낼 수 없습니다.</desc>
